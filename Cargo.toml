[package]
name = "rubiks_cube_simulation"
version = "0.1.0"
edition = "2024"
description = "Rubiks Cube Simulation written in rust with three-d"
repository = "https://github.com/kerrytazi/rubiks_cube_simulation"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rand = "0.10.1"
three-d = { version = "0.19.0", features = ["text"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
